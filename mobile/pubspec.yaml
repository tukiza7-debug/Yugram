name: yugram_chat
description: Yugram FASA 1 - Klien sembang masa nyata (Flutter + BLoC + Socket.io). Sembang peribadi 1-ke-1, ticks hantar/baca, typing, reactions, silent messages.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  socket_io_client: ^2.0.3+1
  http: ^1.2.1
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  uuid: ^4.4.0
  # FASA 2 - media & storan tempatan
  image_picker: ^1.0.7
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
