name: yugram_chat
description: Yugram - Klien sembang masa nyata (Flutter + BLoC + Socket.io). Sembang peribadi + kumpulan, media, ticks hantar/baca, typing, reactions, silent messages.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  socket_io_client: ^2.0.3+1
  http: ^1.2.1
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  uuid: ^4.4.0
  # FASA 2 - media & storan tempatan
  image_picker: ^1.0.7
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Logo launcher Yugram (dijana semasa CI - lihat .github/workflows/flutter-build.yml)
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/icon/yugram_icon_1024.png"
  android: true
  ios: false
  remove_alpha_ios: false
  adaptive_icon_background: "#1D63E0"
  adaptive_icon_foreground: "assets/icon/yugram_icon_foreground_432.png"
  adaptive_icon_monochrome: "assets/icon/yugram_icon_foreground_432.png"

flutter:
  uses-material-design: true
