name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ORG_GRADLE_PROJECT_TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      ORG_GRADLE_PROJECT_TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      ORG_GRADLE_PROJECT_APP_VERSION_CODE: ${{ github.run_number }}
      ORG_GRADLE_PROJECT_APP_VERSION_NAME: "1.0.${{ github.run_number }}"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Dump TdApi public signatures (debug)
        if: failure()
        run: |
          find ~/.gradle/caches -name "*.jar" -path "*tdlib-android*" -exec sh -c 'unzip -o -d /tmp/tdlib_dump "$1"' _ {} \;
          javap -public /tmp/tdlib_dump/org/drinkless/tdlib/TdApi\$*.class > tdapi_signatures.txt 2>&1 || true
      - name: Upload TdApi signatures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tdapi-signatures
          path: tdapi_signatures.txt
