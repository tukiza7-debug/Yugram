name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ORG_GRADLE_PROJECT_TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      ORG_GRADLE_PROJECT_TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      ORG_GRADLE_PROJECT_APP_VERSION_CODE: ${{ github.run_number }}
      ORG_GRADLE_PROJECT_APP_VERSION_NAME: "1.0.${{ github.run_number }}"
      # Fixed signing key — all release APKs share the same signature so they
      # install over each other without "App not installed" conflicts.
      ORG_GRADLE_PROJECT_SIGNING_KEYSTORE_PATH: /tmp/yugram-release.jks
      ORG_GRADLE_PROJECT_SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > /tmp/yugram-release.jks
          echo "Keystore decoded: $(stat -c '%s' /tmp/yugram-release.jks) bytes"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK to Yugram-<version>.apk
        run: |
          cd app/build/outputs/apk/release
          ls -la
          cp app-release.apk "Yugram-${{ github.run_number }}.apk" || cp app-release-unsigned.apk "Yugram-${{ github.run_number }}.apk"
          ls -la

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yugram-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/Yugram-*.apk

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Yugram 1.0.${{ github.run_number }}
          files: app/build/outputs/apk/release/Yugram-*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dump TdApi public signatures (debug)
        if: failure()
        run: |
          find ~/.gradle/caches -name "*.aar" -path "*tdlib*" -exec sh -c 'mkdir -p /tmp/tdlib_dump && unzip -o -d /tmp/tdlib_dump "$1"' _ {} \;
          unzip -o -d /tmp/tdlib_dump /tmp/tdlib_dump/classes.jar
          javap -public /tmp/tdlib_dump/org/drinkless/tdlib/TdApi\$*.class > tdapi_signatures.txt 2>&1 || true
          javap -public /tmp/tdlib_dump/org/drinkless/tdlib/Client.class >> tdapi_signatures.txt 2>&1 || true
      - name: Upload TdApi signatures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tdapi-signatures
          path: tdapi_signatures.txt
