<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Logo Yugram">
  <style>
    @keyframes ygPop   { 0% { transform: scale(.90); opacity: 0; } 12% { transform: scale(1.02); opacity: 1; } 24%,100% { transform: scale(1); opacity: 1; } }
    @keyframes ygRing  { 0%,4% { stroke-dashoffset: 1256.6; } 26%,100% { stroke-dashoffset: 0; } }
    @keyframes ygFly   { 0%,13% { transform: translate(-96px,74px) rotate(-9deg); } 36% { transform: translate(6px,-7px) rotate(1.4deg); } 44%,100% { transform: translate(0,0) rotate(0deg); } }
    @keyframes ygBob   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes ygSpark { 0%,27% { opacity: 0; } 34% { opacity: .95; } 60% { opacity: .95; } 71%,100% { opacity: 0; } }
    @keyframes ygGlow  { 0%,29% { opacity:.30; } 50% { opacity:.78; } 74%,100% { opacity:.42; } }
    #ygBadge    { transform-origin: 256px 256px; animation: ygPop 4.2s cubic-bezier(.34,1.56,.64,1) infinite; }
    #ygRing     { animation: ygRing 4.2s cubic-bezier(.22,.9,.35,1) infinite; }
    #ygPlaneFly { transform-origin: 256px 256px; animation: ygFly 4.2s cubic-bezier(.34,1.56,.64,1) infinite; }
    #ygPlaneBob { animation: ygBob 3.2s ease-in-out infinite; }
    #ygSparks   { animation: ygSpark 4.2s ease-in-out infinite; }
    #ygGlowAnim { animation: ygGlow 3.2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      #ygBadge,#ygRing,#ygPlaneFly,#ygPlaneBob,#ygSparks,#ygGlowAnim { animation: none; }
    }
  </style>
  <g id="ygBadge">
  <defs>
    <linearGradient id="ygBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#41B7F6"/>
      <stop offset="0.55" stop-color="#2B8BEA"/>
      <stop offset="1" stop-color="#1D63E0"/>
    </linearGradient>
    <radialGradient id="ygHi" cx="0.34" cy="0.22" r="0.62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ygGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9FE0FF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9FE0FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="ygBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="ygClip"><circle cx="256" cy="256" r="224"/></clipPath>
  </defs>
  <circle cx="256" cy="256" r="224" fill="url(#ygBg)"/>
  <circle cx="256" cy="256" r="224" fill="url(#ygHi)"/>
  <circle id="ygGlowAnim" cx="262" cy="254" r="150" fill="url(#ygGlow)" opacity="0.55" filter="url(#ygBlur)"/>
  <ellipse cx="266" cy="384" rx="112" ry="24" fill="#0B2A66" opacity="0.20" filter="url(#ygBlur)"/>
  <circle id="ygRing" cx="256" cy="256" r="200" fill="none" stroke="#FFFFFF" stroke-opacity="0.88" stroke-width="9" stroke-linecap="round" stroke-dasharray="1256.6"/>
  <g id="ygSparks">
    <line x1="114.0" y1="262.0" x2="84.0" y2="252.0" stroke="#FFFFFF" stroke-opacity="0.00" stroke-width="11" stroke-linecap="round"/>
    <line x1="124.0" y1="308.0" x2="98.0" y2="318.0" stroke="#FFFFFF" stroke-opacity="0.00" stroke-width="11" stroke-linecap="round"/>
  </g>
  <g id="ygPlaneBob" id="ygPlaneFly">
    <polygon points="388.0,168.0 122.0,242.0 240.0,298.0" fill="#FFFFFF"/>
    <polygon points="388.0,168.0 240.0,298.0 230.0,372.0" fill="#DCEBFF"/>
    <polygon points="122.0,242.0 170.0,312.0 240.0,298.0" fill="#B3D9FF"/>
  </g>
  </g>
</svg>